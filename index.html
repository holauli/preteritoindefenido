<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretérito indefinido — тренажёр глаголов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE4; --card:#FFFCF6; --ink:#1E1A15; --muted:#6E6457; --line:#E5D9C6;
  --accent:#C2410C; --accent-soft:#FBE3D3; --reg:#0F6E66; --reg-soft:#D7EEEA;
  --ok:#2F7D4F; --ok-soft:#DDF1E3; --bad:#B42318; --bad-soft:#FBE1DE; --warn:#A16207; --warn-soft:#FBEFCF;
  --r:16px; --shadow:0 1px 0 rgba(30,26,21,.04),0 8px 24px -12px rgba(30,26,21,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(245,239,228,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:Fraunces,serif;font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand b i{color:var(--accent);font-style:normal}
.brand small{color:var(--muted);font-size:12px;font-weight:600}
.tabs{display:flex;background:#EAE0CF;border-radius:999px;padding:4px}
.tabs button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
main{padding:22px 0 120px}
h2{font-family:Fraunces,serif;font-size:20px;margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
h2 .n{font-family:Manrope;font-size:12px;font-weight:800;color:var(--card);background:var(--ink);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;transform:translateY(-2px)}
h2 .sub{font-family:Manrope;font-size:13px;color:var(--muted);font-weight:500}
.hero{padding:6px 0 4px}
.hero h1{font-family:Fraunces,serif;font-size:clamp(28px,5vw,40px);line-height:1.08;margin:0 0 6px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:620px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.pill{border:1.5px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;transition:.15s}
.pill:hover{border-color:var(--ink)}
.pill.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pill .badge{display:inline-block;margin-left:6px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.cat-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.cat-title.reg{color:var(--reg)} .cat-title.irr{color:var(--accent)}
.cat-title button{font-size:12px;text-transform:none;letter-spacing:0;color:var(--muted);text-decoration:underline;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.group{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);transition:.15s;display:flex;flex-direction:column}
.group.on.reg{border-color:var(--reg);box-shadow:0 0 0 3px var(--reg-soft)}
.group.on.irr{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.g-head{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 4px;text-align:left;width:100%}
.check{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;font-size:14px;font-weight:800;color:#fff}
.group.on .check{border-color:transparent}
.group.on.reg .check{background:var(--reg)} .group.on.irr .check{background:var(--accent)}
.g-title{font-weight:800;line-height:1.25;flex:1}
.g-count{font-size:12px;font-weight:800;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:999px;white-space:nowrap}
.g-hint{padding:2px 14px 0 46px;font-size:13px;color:var(--muted);line-height:1.4}
.g-expand{margin:8px 14px 12px 46px;font-size:13px;font-weight:700;color:var(--ink);align-self:flex-start;padding:3px 0;border-bottom:1.5px dashed var(--line)}
.g-verbs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.vchip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg)}
.vchip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;transition:.15s}
.mode.on{border-color:var(--ink);box-shadow:0 0 0 3px #E3D8C5}
.mode .ic{font-size:22px} .mode b{display:block;margin:4px 0 2px} .mode span{font-size:13px;color:var(--muted);line-height:1.35;display:block}
.settings{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:6px 16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border:0}
.set-row .t b{display:block;font-weight:700} .set-row .t span{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.switch{flex:none;width:46px;height:28px;border-radius:999px;background:#D9CDB8;position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)} .switch.on::after{left:21px}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 0 16px}
.startbar .wrap{display:flex;align-items:center;gap:14px}
.startbar .sum{margin-right:auto;font-size:14px;color:var(--muted);line-height:1.3}
.startbar .sum b{color:var(--ink);font-size:16px;display:block}
.btn{border-radius:12px;padding:12px 20px;font-weight:800;font-size:16px;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.primary:hover{background:#000}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.big{padding:15px 26px;font-size:17px}
.banner{background:var(--accent-soft);border:1.5px solid #F2C1A2;border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
/* session */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.progress{flex:1;height:10px;background:#E6DBC8;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .3s}
.stat{font-weight:800;font-size:14px;white-space:nowrap}
.stat.ok{color:var(--ok)} .stat.bad{color:var(--bad)} .stat.fire{color:var(--accent)}
.xbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-weight:800;color:var(--muted);flex:none}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);text-align:center}
.marker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inf{font-family:Fraunces,serif;font-size:clamp(38px,8vw,54px);font-weight:700;line-height:1.05;margin:6px 0 2px;letter-spacing:-.02em}
.ru{color:var(--muted);font-size:15px}
.pron{display:inline-block;margin:18px 0 10px;background:var(--bg);border-radius:999px;padding:6px 16px;font-weight:800;font-size:18px}
.answer{width:100%;max-width:380px;font:600 24px Manrope,sans-serif;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none;color:var(--ink);transition:.15s}
.answer:focus{border-color:var(--ink)}
.answer.ok{border-color:var(--ok);background:var(--ok-soft)} .answer.bad{border-color:var(--bad);background:var(--bad-soft)} .answer.warn{border-color:var(--warn);background:var(--warn-soft)}
.keys{display:flex;justify-content:center;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.keys button{width:42px;height:42px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:18px}
.keys button:active{background:var(--line)}
.actions{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.fb{margin-top:18px;border-radius:14px;padding:14px 16px;text-align:left;font-size:15px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.warn{background:var(--warn-soft)}
.fb .big{font-family:Fraunces,serif;font-size:20px;font-weight:700;margin-bottom:4px}
.fb .form{font-size:22px;font-weight:800}
.fb mark{background:#FFD36B;border-radius:3px;padding:0 1px;color:inherit}
.fb .rule{margin-top:8px;font-size:13.5px;color:var(--muted);border-top:1px dashed rgba(0,0,0,.12);padding-top:8px}
.fb .rule b{color:var(--ink)}
.hintbox{margin-top:12px;background:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;text-align:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.choice{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 10px;font-size:21px;font-weight:700;position:relative;transition:.12s}
.choice:hover{border-color:var(--ink)}
.choice .k{position:absolute;top:6px;left:9px;font-size:11px;color:var(--muted);font-weight:800}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)} .choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.flip{perspective:1200px;cursor:pointer;user-select:none}
.flip-inner{position:relative;min-height:290px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px}
.face.back{transform:rotateY(180deg)}
.face .tap{margin-top:14px;font-size:13px;color:var(--muted)}
.tbl{width:100%;max-width:460px;margin:14px auto 0;border-collapse:separate;border-spacing:0 8px}
.tbl td{padding:0}
.tbl td.p{text-align:right;padding-right:12px;font-weight:800;color:var(--muted);white-space:nowrap;width:1%}
.tbl input{width:100%;font:600 19px Manrope;padding:10px 12px;border-radius:10px;border:2px solid var(--line);outline:none;background:#fff;color:var(--ink)}
.tbl input:focus{border-color:var(--ink)}
.tbl input.ok{border-color:var(--ok);background:var(--ok-soft)} .tbl input.bad{border-color:var(--bad);background:var(--bad-soft)} .tbl input.warn{border-color:var(--warn);background:var(--warn-soft)}
.tbl .corr{font-size:13px;font-weight:700;color:var(--bad);text-align:left;padding:2px 4px 0}
.tbl .corr mark{background:#FFD36B;color:inherit;border-radius:3px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font:700 11px Manrope;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
.glabel{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;margin-top:10px}
.glabel.reg{background:var(--reg-soft);color:var(--reg)} .glabel.irr{background:var(--accent-soft);color:var(--accent)}
/* results */
.res{text-align:center}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:Fraunces,serif;font-size:36px;font-weight:700}
.res h1{font-family:Fraunces,serif;margin:0 0 4px}
.res .stats{display:flex;justify-content:center;gap:24px;margin:10px 0 20px;flex-wrap:wrap}
.res .stats div b{display:block;font-size:24px}
.res .stats div span{font-size:13px;color:var(--muted)}
.errlist{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);text-align:left;margin:18px 0;overflow:hidden}
.errlist .row{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:baseline;flex-wrap:wrap}
.errlist .row:last-child{border:0}
.errlist .row .who{color:var(--muted);font-weight:700;min-width:120px;font-size:14px}
.errlist .row .c{font-weight:800}
.errlist .row .y{color:var(--bad);text-decoration:line-through;font-size:14px}
.errlist .head{padding:12px 16px;font-weight:800;background:var(--bg)}
/* reference */
.ref-g{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ref-g h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ref-g p{margin:0 0 10px;color:var(--muted);font-size:14px}
.endings{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.endings span{font-size:13px;background:var(--bg);border-radius:8px;padding:3px 8px}
.endings span b{color:var(--muted);font-weight:600;margin-right:4px}
.ref-verbs{display:flex;flex-wrap:wrap;gap:6px}
.ref-verbs button{font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff}
.ref-verbs button:hover{border-color:var(--ink)}
.modal-bg{position:fixed;inset:0;background:rgba(30,26,21,.45);z-index:50;display:grid;place-items:center;padding:18px}
.modal{background:var(--card);border-radius:22px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.modal .xbtn{position:absolute;top:14px;right:14px}
.modal table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:17px}
.modal td{padding:8px 4px;border-bottom:1px solid var(--line)}
.modal td:first-child{color:var(--muted);font-weight:700;font-size:14px;width:44%}
.modal td:last-child{font-weight:800}
.modal mark{background:#FFD36B;color:inherit;border-radius:3px;padding:0 1px}
.note{font-size:13px;background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;font-size:14px;animation:fade 2.4s forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.shake{animation:shake .4s}
[hidden]{display:none!important}
@media (max-width:560px){
  .hbar{height:56px} .brand small{display:none}
  .tabs button{padding:6px 11px;font-size:13px}
  .qcard{padding:22px 14px}
  .g-hint{padding-left:14px} .g-expand{margin-left:14px}
  .startbar .sum{font-size:12px} .startbar .sum b{font-size:14px}
  .btn.big{padding:13px 18px;font-size:16px}
}
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <div class="brand"><b>Pretérito <i>indefinido</i></b><small>EspañolPro · тренажёр глаголов</small></div>
    <nav class="tabs">
      <button data-action="tab" data-tab="train" class="on">Тренировка</button>
      <button data-action="tab" data-tab="ref">Справочник</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-setup"></section>
  <section id="v-session" hidden></section>
  <section id="v-results" hidden></section>
  <section id="v-ref" hidden></section>
</main>

<div class="startbar" id="startbar">
  <div class="wrap">
    <div class="sum" id="sum"></div>
    <button class="btn primary big" data-action="start" id="startBtn">Начать →</button>
  </div>
</div>
<div id="modal"></div>

<script>
/*DATA*/
const AR=['é','aste','ó','amos','asteis','aron'], ER=['í','iste','ió','imos','isteis','ieron'];
const PERSONS=['yo','tú','él / ella / usted','nosotros','vosotros','ellos / ellas / ustedes'];
const PSHORT=['yo','tú','él/ella','nosotros','vosotros','ellos/ellas'];
function regular(inf){const st=inf.slice(0,-2);return (inf.endsWith('ar')?AR:ER).map(e=>st+e);}
function ortoF(inf){const f=regular(inf);f[0]=inf.slice(0,-3)+({car:'qué',gar:'gué',zar:'cé'})[inf.slice(-3)];return f;}
function yA(st){return [st+'í',st+'íste',st+'yó',st+'ímos',st+'ísteis',st+'yeron'];}
function yU(st){return [st+'í',st+'iste',st+'yó',st+'imos',st+'isteis',st+'yeron'];}
function stemF(inf,s3){const f=regular(inf);f[2]=s3+'ió';f[5]=s3+'ieron';return f;}
function strong(st,j){return [st+'e',st+'iste',st+'o',st+'imos',st+'isteis',st+(j?'eron':'ieron')];}
const V=(inf,ru,f,note)=>({inf,ru,f,note});
const NOTE_PRES='В настоящем времени глагол меняет основу, но в indefinido он правильный.';
const GROUPS=[
 {id:'ar',cat:'reg',name:'Правильные на -ar',hint:'hablé, hablaste, habló, hablamos, hablasteis, hablaron',end:AR,verbs:[
  V('hablar','говорить'),V('trabajar','работать'),V('estudiar','учиться'),V('comprar','покупать'),V('viajar','путешествовать'),V('cantar','петь'),V('bailar','танцевать'),V('cocinar','готовить'),V('escuchar','слушать'),V('mirar','смотреть'),V('tomar','брать, пить'),V('llamar','звонить'),V('visitar','посещать'),V('ayudar','помогать'),V('preparar','готовить'),V('cenar','ужинать'),V('desayunar','завтракать'),V('terminar','заканчивать'),V('ganar','выигрывать'),V('nadar','плавать'),V('pasar','проводить (время)'),V('regresar','возвращаться'),V('pensar','думать',null,NOTE_PRES),V('cerrar','закрывать',null,NOTE_PRES),V('encontrar','находить',null,NOTE_PRES),V('contar','рассказывать',null,NOTE_PRES)]},
 {id:'erir',cat:'reg',name:'Правильные на -er / -ir',hint:'comí, comiste, comió, comimos, comisteis, comieron',end:ER,verbs:[
  V('comer','есть'),V('beber','пить'),V('aprender','учить'),V('comprender','понимать'),V('correr','бегать'),V('vender','продавать'),V('vivir','жить'),V('escribir','писать'),V('abrir','открывать'),V('recibir','получать'),V('subir','подниматься'),V('decidir','решать'),V('compartir','делиться'),V('nacer','родиться'),V('romper','ломать'),V('volver','возвращаться',null,NOTE_PRES),V('perder','терять',null,NOTE_PRES),V('entender','понимать',null,NOTE_PRES),V('conocer','знакомиться, знать',null,'Только yo conozco в настоящем; в indefinido — правильный.'),V('salir','выходить',null,'Только yo salgo в настоящем; в indefinido — правильный.')]},
 {id:'orto',cat:'reg',name:'Орфография в «yo»: -car, -gar, -zar',hint:'Меняется только yo: busqué, llegué, empecé. Остальные формы правильные.',verbs:[
  ['buscar','искать'],['tocar','трогать; играть (на инстр.)'],['sacar','доставать'],['practicar','практиковать'],['explicar','объяснять'],['llegar','прибывать'],['jugar','играть'],['pagar','платить'],['apagar','выключать'],['empezar','начинать'],['comenzar','начинать'],['almorzar','обедать'],['cruzar','пересекать'],['organizar','организовывать']].map(([i,r])=>V(i,r,ortoF(i)))},
 {id:'y',cat:'irr',name:'i → y в 3-м лице',hint:'leyó, leyeron, oyó. Тильда: leíste, leímos (но construiste, construimos).',verbs:[

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.random()*a.length|0];
const strip=s=>s.normalize('NFD').replace(/́/g,'').normalize('NFC');
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ').replace(/^(yo|tú|tu|él|el|ella|usted|ud\.?|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes|uds\.?)\s+/,'');
function toggleAccent(w){
  if(/[áéíóú]/.test(w)) return strip(w);
  const m={a:'á',e:'é',i:'í',o:'ó',u:'ú'};
  const i=w.search(/[aeiou][^aeiou]*$/); if(i<0) return null;
  return w.slice(0,i)+m[w[i]]+w.slice(i+1);
}
function judge(input,correct){
  const a=norm(input); if(!a) return 'empty';
  if(a===correct) return 'ok';
  if(strip(a)===strip(correct)) return st.strict?'accent':'ok-accent';
  return 'bad';
}
// highlight chars in b that are not part of LCS with a
function diff(a,b){
  a=a||'';const n=a.length,m=b.length,d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const keep=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){keep[j]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++;}
  let out='',open=false;
  for(let k=0;k<m;k++){if(!keep[k]&&!open){out+='<mark>';open=true}if(keep[k]&&open){out+='</mark>';open=false}out+=esc(b[k]);}
  return out+(open?'</mark>':'');
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2500);}

function updateSum(){

function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}

/* ---------- session ---------- */
let S=null;
function buildItems(){
  const vs=selectedVerbs(), ps=[...st.persons].sort();
  if(st.mode==='table') return vs.map(v=>({v}));
  if(st.mistakesOnly) return Object.keys(mistakes).map(k=>{const [i,p]=k.split('|');return VBY[i]?{v:VBY[i],p:+p}:null}).filter(Boolean);
  return vs.flatMap(v=>ps.map(p=>({v,p})));
}
function startSession(items){
  items=items||buildItems();
  if(!items.length||!st.persons.size) return toast('Выбери хотя бы один глагол и одно лицо');
  shuffle(items);
  const n=st.count==='all'?items.length:Math.min(items.length,st.count);
  S={mode:st.mode,queue:items.slice(0,n).map(x=>({...x,rep:0})),done:0,right:0,wrong:0,streak:0,best:0,errors:[],cur:null,answered:false};
  show('session');next();
}
function next(){
  S.cur=S.queue.shift();
  if(!S.cur) return finish();
  S.answered=false;S.hint=false;S.marker=rnd(MARKERS);
  renderQ();
}
function record(item,p,ok,given){
  const key=item.v.inf+'|'+p;
  if(ok){S.right++;S.streak++;S.best=Math.max(S.best,S.streak);if(mistakes[key]){mistakes[key]--;if(mistakes[key]<=0)delete mistakes[key];}}
  else{S.wrong++;S.streak=0;mistakes[key]=(mistakes[key]||0)+1;S.errors.push({v:item.v,p,given});}
  saveM();
}
function requeue(item){
  if(!st.smart||item.rep>=2) return;
  const pos=Math.min(S.queue.length,2+(Math.random()*3|0));
  S.queue.splice(pos,0,{...item,rep:item.rep+1});
}
function topbar(){
  const total=S.done+S.queue.length+(S.answered?0:1);
  const pct=total?Math.round(S.done/total*100):0;

   <div class="progress"><i style="width:${pct}%"></i></div>
   <span class="stat ok">✓ ${S.right}</span><span class="stat bad">✗ ${S.wrong}</span>${S.streak>=3?`<span class="stat fire">🔥${S.streak}</span>`:''}</div>`;
}

      <div class="kbd" style="text-align:center"><kbd>Пробел</kbd> — перевернуть · <kbd>1</kbd> не вспомнил · <kbd>2</kbd> вспомнил</div>`;

function distractors(it){
  const f=it.v.f,c=f[it.p],out=[];
  const add=x=>{if(x&&x!==c&&!out.includes(x))out.push(x)};
  add(regular(it.v.inf)[it.p]);
  add(toggleAccent(c));
  if(/jeron$/.test(c)) add(c.replace(/jeron$/,'jieron'));
  if(it.v.g.id==='stem') add(f[it.p===2?0:it.p].replace(/í$/,'ió'));
  shuffle([0,1,2,3,4,5].filter(i=>i!==it.p)).forEach(i=>add(f[i]));
  return out.slice(0,3);
}
let lastInput=null;

function checkWrite(giveUp){
  if(S.answered) return next();
  const it=S.cur,c=it.v.f[it.p],inp=$('#ans'),val=giveUp?'':inp.value;
  const r=giveUp?'bad':judge(val,c);
  if(r==='empty'){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');return;}
  S.answered=true;S.done++;
  const ok=r==='ok'||r==='ok-accent';
  record(it,it.p,ok,val);
  if(!ok) requeue(it);
  inp.classList.add(ok?(r==='ok'?'ok':'warn'):(r==='accent'?'warn':'bad'));inp.readOnly=true;
  let html;
  if(r==='ok') html=`<div class="fb ok"><div class="big">¡Correcto! ${S.streak>=3?'🔥':''}</div><div class="form">${PERSONS[it.p].split(' ')[0]} ${c}</div>${it.v.note?`<div class="note">${it.v.note}</div>`:''}</div>`;
  else if(r==='ok-accent') html=`<div class="fb warn"><div class="big">Засчитано, но проверь тильду</div><div class="form">${diff(norm(val),c)}</div></div>`;
  else if(r==='accent') html=`<div class="fb warn"><div class="big">Почти! Ошибка в ударении</div>Правильно: <span class="form">${diff(norm(val),c)}</span>${ruleHTML(it.v)}</div>`;
  else html=`<div class="fb bad"><div class="big">${giveUp?'Запомни:':'Не совсем'}</div>Правильно: <span class="form">${diff(norm(val),c)}</span>${val?`<div style="margin-top:2px;font-size:14px">Твой ответ: <s>${esc(val)}</s></div>`:''}${ruleHTML(it.v)}</div>`;
  $('#fb').innerHTML=html;
  $('#acts').innerHTML=`<button class="btn primary" data-action="next">Дальше ↵</button>`;
  $('.keys').hidden=true;
  inp.blur();
  updateBar();
}
function updateBar(){const b=document.querySelector('.sbar');if(b)b.outerHTML=topbar();}
function pick(i){
  if(S.answered) return;
  const it=S.cur,c=it.v.f[it.p],o=it.opts[i],ok=o===c;
  S.answered=true;S.done++;record(it,it.p,ok,o);if(!ok)requeue({...it,opts:null});
  document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(it.opts[j]===c)b.classList.add('ok');else if(j===i)b.classList.add('bad');});
  $('#fb').innerHTML=ok?`<div class="fb ok"><div class="big">¡Correcto! ${S.streak>=3?'🔥':''}</div>${it.v.note?`<div class="note">${it.v.note}</div>`:''}</div>`
    :`<div class="fb bad"><div class="big">Правильно: ${c}</div>${ruleHTML(it.v)}</div>`;
  $('#fb').insertAdjacentHTML('beforeend',`<div class="actions"><button class="btn primary" data-action="next">Дальше ↵</button></div>`);
  updateBar();
}
function flip(){const f=$('#flip');if(!f)return;f.classList.add('on');$('#cardacts').hidden=false;S.flipped=true;}
function cardAns(ok){if(!S.flipped)return flip();S.flipped=false;S.done++;record(S.cur,S.cur.p,ok,null);if(!ok)requeue(S.cur);next();}
function tableCheck(reveal){
  if(S.answered) return next();
  const it=S.cur,ins=[...document.querySelectorAll('.tbl input')];
  if(!reveal&&ins.every(i=>!i.value.trim())){toast('Заполни хотя бы одну клетку');return;}
  S.answered=true;let anyBad=false,good=0;
  ins.forEach(inp=>{
    const p=+inp.dataset.p,c=it.v.f[p],r=reveal?'bad':judge(inp.value,c);
    const ok=r==='ok'||r==='ok-accent';
    S.done++;record(it,p,ok,inp.value);if(!ok)anyBad=true;else good++;
    inp.classList.add(ok?(r==='ok'?'ok':'warn'):(r==='accent'?'warn':'bad'));inp.readOnly=true;
    if(!ok||r==='ok-accent') $('#c'+p).innerHTML='→ '+diff(norm(inp.value),c);
  });
  if(anyBad) requeue(it);
  $('#fb').innerHTML=anyBad?`<div class="fb bad"><div class="big">${good} из ${ins.length} верно</div>${ruleHTML(it.v)}</div>`:`<div class="fb ok"><div class="big">¡Perfecto! Всё верно ${S.streak>=3?'🔥':''}</div></div>`;
  $('#acts').innerHTML=`<button class="btn primary" data-action="next">Дальше ↵</button>`;
  $('.keys').hidden=true;document.activeElement&&document.activeElement.blur();
  updateBar();
}
function finish(){
  const total=S.right+S.wrong,pct=total?Math.round(S.right/total*100):0;
  const col=pct>=85?'var(--ok)':pct>=60?'var(--warn)':'var(--bad)';
  const seen=new Set(),errs=S.errors.filter(e=>{const k=e.v.inf+'|'+e.p;if(seen.has(k))return false;seen.add(k);return true;});
  const msg=pct===100?'¡Increíble! Без ошибок':pct>=85?'¡Muy bien!':pct>=60?'¡Bien! Есть что повторить':'Нужно ещё потренироваться';
  $('#v-results').innerHTML=`<div class="res">
    <div class="ring" style="background:conic-gradient(${col} ${pct*3.6}deg,#E6DBC8 0)"><div>${pct}%</div></div>
    <h1>${msg}</h1>
    <div class="stats"><div><b style="color:var(--ok)">${S.right}</b><span>верно</span></div><div><b style="color:var(--bad)">${S.wrong}</b><span>ошибок</span></div><div><b style="color:var(--accent)">${S.best}</b><span>лучшая серия</span></div></div>
    <div class="actions">${errs.length?`<button class="btn primary" data-action="redo">🔁 Повторить ошибки (${errs.length})</button>`:''}<button class="btn ${errs.length?'ghost':'primary'}" data-action="again">Ещё раз</button><button class="btn ghost" data-action="tosetup">Настройки</button></div>
    ${errs.length?`<div class="errlist"><div class="head">Над чем поработать</div>${errs.map(e=>`<div class="row"><span class="who">${PSHORT[e.p]} · ${e.v.inf}</span><span class="c">${e.v.f[e.p]}</span>${e.given?`<span class="y">${esc(e.given)}</span>`:''}</div>`).join('')}</div>`:''}
  </div>`;
  S.lastErrors=errs;
  show('results');
}

/* ---------- reference ---------- */
function renderRef(){
  $('#v-ref').innerHTML=`<div class="hero"><h1>Справочник</h1><p>Правила по группам. Нажми на глагол — увидишь всё спряжение, особенности выделены жёлтым.</p></div>`+
  ['reg','irr'].map(c=>`<div class="cat-title ${c}" style="margin-top:22px">● ${c==='reg'?'Правильные':'Неправильные'}</div>`+
   GROUPS.filter(g=>g.cat===c).map(g=>`<div class="ref-g"><h3>${g.name}</h3><p>${g.hint}</p>
    ${g.end?`<div class="endings">${g.end.map((e,i)=>`<span><b>${PSHORT[i]}</b>-${e}</span>`).join('')}</div>`:''}
    <div class="ref-verbs">${g.verbs.map(v=>`<button data-action="vinfo" data-v="${v.inf}">${v.inf}</button>`).join('')}</div></div>`).join('')).join('');
}
function vinfo(inf){
  const v=VBY[inf],reg=regular(inf),irr=v.g.cat==='irr'||v.g.id==='orto';
  $('#modal').innerHTML=`<div class="modal-bg" data-action="closem"><div class="modal">
    <button class="xbtn" data-action="closem">✕</button>
    <div class="inf" style="font-size:38px">${v.inf}</div><div class="ru">${esc(v.ru)}</div>
    <span class="glabel ${v.g.cat}">${v.g.name}</span>
    <table>${v.f.map((f,i)=>`<tr><td>${PERSONS[i]}</td><td>${irr?diff(reg[i],f):f}</td></tr>`).join('')}</table>
    ${v.note?`<div class="note" style="margin-bottom:12px">${v.note}</div>`:''}
    <button class="btn primary" style="width:100%" data-action="trainv" data-v="${v.inf}">Тренировать этот глагол →</button>
  </div></div>`;
}

/* ---------- actions ---------- */
const A={
  tab(el){if(el.dataset.tab==='ref'){renderRef();show('ref')}else{if(S&&view==='ref'&&S.cur&&!S.finished){show('session')}else{renderSetup();show('setup')}}},
  group(el){const g=GROUPS.find(x=>x.id===el.dataset.g);
    if(st.groups.has(g.id))st.groups.delete(g.id);else{st.groups.add(g.id);if(g.verbs.every(v=>st.excluded.has(v.inf)))g.verbs.forEach(v=>st.excluded.delete(v.inf));}
    save();renderSetup();},
  expand(el){const g=el.dataset.g;expanded.has(g)?expanded.delete(g):expanded.add(g);renderSetup();},
  verb(el){const v=VBY[el.dataset.v],g=v.g;
    if(!st.groups.has(g.id)){st.groups.add(g.id);g.verbs.forEach(x=>st.excluded.add(x.inf));st.excluded.delete(v.inf);}
    else if(st.excluded.has(v.inf))st.excluded.delete(v.inf);
    else{st.excluded.add(v.inf);if(g.verbs.every(x=>st.excluded.has(x.inf))){st.groups.delete(g.id);g.verbs.forEach(x=>st.excluded.delete(x.inf));}}
    save();renderSetup();},
  cat(el){GROUPS.filter(g=>g.cat===el.dataset.c).forEach(g=>{st.groups.add(g.id);g.verbs.forEach(v=>st.excluded.delete(v.inf))});save();renderSetup();},
  preset(el){const p=el.dataset.p;
    if(p==='mist'){if(!mCount())return toast('Пока ошибок нет — сначала потренируйся 🙂');st.mistakesOnly=true;if(st.mode==='table')st.mode='write';renderSetup();return;}
    if(p==='mistoff'){st.mistakesOnly=false;renderSetup();return;}
    st.mistakesOnly=false;st.excluded.clear();
    const ids=p==='all'?GROUPS.map(g=>g.id):p==='reg'?GROUPS.filter(g=>g.cat==='reg').map(g=>g.id):p==='irr'?GROUPS.filter(g=>g.cat==='irr').map(g=>g.id):['u','i','j'];
    st.groups=new Set(ids);save();renderSetup();},
  person(el){const i=el.dataset.i;if(i==='all'){st.persons=st.persons.size===6?new Set():new Set([0,1,2,3,4,5]);}else{const n=+i;st.persons.has(n)?st.persons.delete(n):st.persons.add(n);}save();renderSetup();},
  mode(el){st.mode=el.dataset.m;if(st.mode==='table'&&st.mistakesOnly)st.mistakesOnly=false;save();renderSetup();},
  count(el){const c=el.dataset.c;st.count=c==='all'?'all':+c;save();renderSetup();},
  sw(el){st[el.dataset.k]=!st[el.dataset.k];save();renderSetup();},
  start(){startSession();},
  quit(){if(S.done)finish();else{renderSetup();show('setup');}},
  check(){checkWrite(false)}, idk(){checkWrite(true)}, next(){next()},
  hint(){S.hint=true;const v=$('#ans').value;renderQ();$('#ans').value=v;},
  key(el){const inp=lastInput&&document.body.contains(lastInput)&&!lastInput.readOnly?lastInput:$('#ans');if(!inp||inp.readOnly)return;
    const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+el.dataset.k+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1);},
  pick(el){pick(+el.dataset.i)}, flip(){if(!S.flipped)flip()}, card(el){cardAns(el.dataset.ok==='1')},
  tcheck(){tableCheck(false)}, tshow(){tableCheck(true)},
  redo(){const items=S.lastErrors.map(e=>S.mode==='table'?{v:e.v}:{v:e.v,p:e.p});const u=[];const s=new Set();items.forEach(x=>{const k=x.v.inf+'|'+(x.p??'');if(!s.has(k)){s.add(k);u.push(x)}});const c=st.count;st.count='all';startSession(u);st.count=c;},
  again(){startSession()}, tosetup(){renderSetup();show('setup')},
  vinfo(el){vinfo(el.dataset.v)},
  closem(el,e){if(e.target===el)$('#modal').innerHTML='';},
  trainv(el){const v=VBY[el.dataset.v];st.mistakesOnly=false;st.groups=new Set([v.g.id]);st.excluded=new Set(v.g.verbs.filter(x=>x!==v).map(x=>x.inf));expanded.add(v.g.id);save();$('#modal').innerHTML='';renderSetup();show('setup');},
};
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-action="key"]'))e.preventDefault();});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const f=A[el.dataset.action];if(f)f(el,e);});
document.addEventListener('keydown',e=>{
  if($('#modal').innerHTML&&e.key==='Escape'){$('#modal').innerHTML='';return;}
  if(view!=='session'||!S) return;
  const m=S.mode;
  if(m==='write'&&e.key==='Enter'){e.preventDefault();checkWrite(false);}
  else if(m==='choice'){if(/^[1-4]$/.test(e.key)&&!S.answered)pick(+e.key-1);else if(e.key==='Enter'&&S.answered){e.preventDefault();next();}}
  else if(m==='cards'){if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!S.flipped)flip();}else if(e.key==='1'&&S.flipped)cardAns(false);else if(e.key==='2'&&S.flipped)cardAns(true);}
  else if(m==='table'&&e.key==='Enter'){e.preventDefault();
    if(S.answered)return next();
    const ins=[...document.querySelectorAll('.tbl input')],i=ins.indexOf(document.activeElement);
    if(i>=0&&i<ins.length-1)ins[i+1].focus();else tableCheck(false);}
});
renderSetup();
</script>
</body>
